name: App CI

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        # v4
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        # v4
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-unit-test-reports
          path: |
            app/app/build/reports/tests/testDebugUnitTest/**
            app/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
