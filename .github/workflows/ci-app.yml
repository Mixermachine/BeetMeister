name: App CI

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "firmware/**"
      - "scripts/release/**"
      - "scripts/dev/verify-firmware-release-config.ps1"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "app/**"
      - "firmware/**"
      - "scripts/release/**"
      - "scripts/dev/verify-firmware-release-config.ps1"
      - ".github/workflows/ci-app.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundled-firmware:
    name: Build bundled firmware artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Restore ESP-IDF cache
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/esp-idf
            .ci-cache/esp-tools
          key: ${{ runner.os }}-espidf-v6.0-v1
          restore-keys: |
            ${{ runner.os }}-espidf-v6.0-

      - name: Set up ESP-IDF v6.0
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae
        with:
          version: v6.0
          path: ${{ github.workspace }}/.ci-cache/esp-idf
          tools-path: ${{ github.workspace }}/.ci-cache/esp-tools

      - name: Build bundled firmware
        working-directory: firmware/esp-idf
        env:
          SDKCONFIG_DEFAULTS: sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.release.defaults
          SDKCONFIG: build/sdkconfig.release.generated
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DESCRIBE="$(git describe --tags --always --dirty)"
          rm -f "$SDKCONFIG"
          idf.py set-target esp32s3
          idf.py -DSDKCONFIG="$SDKCONFIG" -DBEET_FIRMWARE_VERSION="dev-${SHORT_SHA}" -DBEET_BUILD_LABEL="${DESCRIBE}" build

      - name: Validate release firmware config
        shell: pwsh
        run: ./scripts/dev/verify-firmware-release-config.ps1 -SdkconfigPath ./firmware/esp-idf/build/sdkconfig.release.generated

      - name: Upload bundled firmware
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bundled-firmware
          path: firmware/esp-idf/build/beetmeister.bin
          if-no-files-found: error

  app-build:
    name: Build Android app
    needs: bundled-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 17
        # v4
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        # v4
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e

      - name: Download bundled firmware
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bundled-firmware
          path: bundled-firmware

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        env:
          BEET_BUNDLED_FIRMWARE_IMAGE: ${{ github.workspace }}/bundled-firmware/beetmeister.bin
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        # v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: app-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        # v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: app-unit-test-reports
          path: |
            app/app/build/reports/tests/testDebugUnitTest/**
            app/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
